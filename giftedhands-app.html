* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ── Sidebar ── */
.sb { background: var(--sb); position: fixed; left: 0; top: 0; height: 100vh; width: 240px; display: flex; flex-direction: column; z-index: 40; }
.sb-logo { padding: 20px 18px 18px; border-bottom: 1px solid var(--sb-border); display: flex; align-items: center; gap: 12px; }
.sb-logo-mark { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.sb-logo-name { font-size: 13px; font-weight: 600; color: #e8f0f4; letter-spacing: -0.01em; line-height: 1.2; }
.sb-logo-sub { font-size: 10px; color: var(--sb-text); letter-spacing: 0.04em; margin-top: 1px; }
.sb-nav { flex: 1; padding: 16px 10px; overflow-y: auto; }
.sb-nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sb-label); padding: 0 10px; margin-bottom: 8px; display: block; }
.sb-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--sb-text); text-decoration: none; transition: background 0.12s, color 0.12s; border-left: 2px solid transparent; margin-bottom: 1px; position: relative; }
.sb-link:hover { background: var(--sb-hover); color: #e8f0f4; }
.sb-link.active { background: var(--sb-active-bg); color: var(--sb-active-text); border-left-color: var(--accent); font-weight: 600; }
.sb-link-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; opacity: 0.85; }
.sb-footer { padding: 14px 14px 16px; border-top: 1px solid var(--sb-border); }
.sb-modules { background: rgba(255,255,255,0.045); border-radius: 6px; padding: 9px 11px; margin-bottom: 10px; }
.sb-modules-label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sb-label); margin-bottom: 4px; }
.sb-modules-list { font-size: 11px; color: var(--sb-text); opacity: 0.7; letter-spacing: 0.02em; }
.sb-disclaimer { font-size: 10px; color: var(--sb-text); opacity: 0.45; line-height: 1.5; }

/* ── Chips ── */
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; margin: 2px; line-height: 1.6; letter-spacing: 0.01em; border: 1px solid transparent; }

/* ── Emoji mood ── */
.emoji-btn { font-size: 26px; cursor: pointer; padding: 5px 7px; border-radius: 8px; border: 2px solid transparent; transition: all .12s; background: transparent; }
.emoji-btn.sel { border-color: var(--accent); background: var(--accent-light); }

/* ── Cards ── */
.card { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.card:hover.card-hover { border-color: var(--accent-border); box-shadow: var(--shadow); }

/* ── Buttons ── */
.btn-accent { background: var(--accent); color: #fff; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: background 0.12s; text-decoration: none; display: inline-flex; align-items: center; }
.btn-accent:hover { background: var(--accent-h); }
.btn-outline { background: var(--surface); color: var(--accent); border: 1px solid var(--accent-border); border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.12s; text-decoration: none; display: inline-flex; align-items: center; }
.btn-outline:hover { background: var(--accent-light); }
.btn-ghost { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.12s; text-decoration: none; display: inline-flex; align-items: center; }
.btn-ghost:hover { background: var(--bg); }
.btn-sm { padding: 5px 10px; font-size: 11px; }

/* ── Form inputs ── */
.field { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; font-size: 13px; background: var(--surface); color: var(--text); font-family: inherit; transition: border-color 0.12s; }
.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
textarea.field { resize: vertical; }

/* ── Labels ── */
.lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; display: block; }

/* ── Headings with warm serif ── */
.page-title { font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; color: var(--text); line-height: 1.25; text-wrap: balance; }
.section-title { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }

/* ── Divider ── */
.divider { height: 1px; background: var(--border-light); margin: 12px 0; }

/* ── Stars ── */
.star { font-size: 18px; cursor: pointer; transition: transform 0.1s; }
.star:hover { transform: scale(1.2); }

/* ── Toggle filter buttons ── */
.filter-btn { padding: 6px 13px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.12s; }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.filter-btn:not(.active):hover { border-color: var(--accent-border); color: var(--accent); }

/* ── Success/warning banners ── */
.banner-warn { background: var(--risk-m-bg); border: 1px solid var(--risk-m-border); border-radius: 9px; padding: 14px 16px; display: flex; gap: 12px; }
.banner-success { background: var(--risk-l-bg); border: 1px solid var(--risk-l-border); border-radius: 9px; padding: 12px 14px; font-size: 12px; color: var(--risk-l); font-weight: 500; text-align: center; }

/* ── Step progress ── */
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.step-dot.done { background: var(--risk-l); color: #fff; }
.step-dot.current { background: var(--accent); color: #fff; }
.step-dot.todo { background: var(--border); color: var(--text-faint); }
.step-label { font-size: 11px; font-weight: 500; }
.step-line { flex: 1; height: 2px; }
.step-line.done { background: var(--risk-l); }
.step-line.todo { background: var(--border); }

/* ── Avatar ── */
.avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; }

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  const s = m[r] || {bg:'var(--bg)',color:'var(--text-muted)',border:'var(--border)'};
  return <span className="chip" style={{background:s.bg,color:s.color,borderColor:s.border}}>{r} Risk</span>;
};

const StBadge = ({s}) => {
  const m = {
    Arrived:     {bg:'var(--st-arrived-bg)',   color:'var(--st-arrived)',  border:'var(--st-arrived-border)'},
    'In Progress':{bg:'var(--st-prog-bg)',      color:'var(--st-prog)',     border:'var(--st-prog-border)'},
    Completed:   {bg:'var(--st-done-bg)',       color:'var(--st-done)',     border:'var(--st-done-border)'},
    Pending:     {bg:'var(--st-pend-bg)',       color:'var(--st-pend-text)',border:'var(--st-pend-border)'},
  };
  const st = m[s] || {bg:'var(--bg)',color:'var(--text-muted)',border:'var(--border)'};
  return <span className="chip" style={{background:st.bg,color:st.color,borderColor:st.border}}>{s}</span>;
};

const AvBadge = ({a}) => {
  const m = {
    Available:{bg:'var(--avail-yes-bg)',color:'var(--avail-yes)',border:'var(--risk-l-border)'},
    Busy:     {bg:'var(--avail-busy-bg)',color:'var(--avail-busy)',border:'var(--risk-m-border)'},

  const s = m[a] || {bg:'var(--bg)',color:'var(--text-muted)',border:'var(--border)'};
  return <span className="chip" style={{background:s.bg,color:s.color,borderColor:s.border}}>{a}</span>;
};

const ICPSIntake = ({onNew}) => {
  const [step, setStep] = useState(1);

  const [f, setF] = useState({fn:'',ln:'',age:'',pronouns:'He/Him',cgName:'',cgRel:'',cgPhone:'',cgNotes:'',comm:'',lang:'English',verbal:'',avoid:[],pref:[],calm:[],aI:'',pI:'',cI:'',history:'',goals:'',staffNotes:'',emergency:'',consent:false});
  const set = (k,v) => setF(p => ({...p, [k]:v}));
  const steps = ['Basic Info','Caregiver','Communication','Sensory Profile','Visit Goals','Consent'];

  const rmTag = (field,v) => set(field, f[field].filter(x => x !== v));

    onNew({id:'client-'+Date.now(),firstName:f.fn,lastName:f.ln,age:parseInt(f.age)||0,pronouns:f.pronouns,risk:'Moderate',lastVisit:null,isNew:true,tags:['new client'],

      res:{lighting:'Soft warm light',soundLevel:'Low',chair:'Standard',tools:f.calm,visuals:'Visual schedule recommended',pacing:'Slow and narrated',time:'5 minutes',doNotUse:f.avoid,ssepRec:'Assign based on availability'}});
    setDone(true);
  };

  if (done) return (
    <div style={{padding:'32px 36px'}}>
      <div style={{maxWidth:440,margin:'60px auto',textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>✅</div>

          <a href="#/clients" className="btn-accent">View All Clients</a>
          <button className="btn-ghost" onClick={() => {setDone(false);setStep(1);setF({fn:'',ln:'',age:'',pronouns:'He/Him',cgName:'',cgRel:'',cgPhone:'',cgNotes:'',comm:'',lang:'English',verbal:'',avoid:[],pref:[],calm:[],aI:'',pI:'',cI:'',history:'',goals:'',staffNotes:'',emergency:'',consent:false});}}>

      <div style={{display:'flex',alignItems:'center',gap:0,marginBottom:28}}>
        {steps.map((s,i) => (
          <React.Fragment key={s}>

              <div className={`step-dot ${i+1 < step ? 'done' : i+1 === step ? 'current' : 'todo'}`}>
                {i+1 < step ? '✓' : i+1}
              </div>
              <span className="step-label" style={{color: i+1 === step ? 'var(--accent)' : 'var(--text-faint)',display:'none'}}>{s}</span>

      <div className="card" style={{padding:'24px',maxWidth:560}}>

            <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Last Name *</label><input value={f.ln} onChange={e=>set('ln',e.target.value)} className="field"/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Age</label><input type="number" value={f.age} onChange={e=>set('age',e.target.value)} className="field"/></div>
            <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Pronouns</label>
              <select value={f.pronouns} onChange={e=>set('pronouns',e.target.value)} className="field" style={{background:'var(--surface)'}}>
                {['He/Him','She/Her','They/Them','He/They','She/They','Ask each time'].map(p=><option key={p}>{p}</option>)}
              </select>

          </div>
        </div>}

        {step === 2 && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <p className="section-title" style={{marginBottom:4}}>Caregiver / Guardian Information</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Caregiver Name</label><input value={f.cgName} onChange={e=>set('cgName',e.target.value)} className="field"/></div>

          <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Phone Number</label><input value={f.cgPhone} onChange={e=>set('cgPhone',e.target.value)} className="field"/></div>

        </div>}

        {step === 3 && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <p className="section-title" style={{marginBottom:4}}>Communication &amp; Language</p>
          <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Communication Style</label><textarea value={f.comm} onChange={e=>set('comm',e.target.value)} placeholder="How does this person communicate best? Verbal, gestures, AAC device, picture cards…" className="field" style={{height:96}}/></div>
          <div><label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>Primary Language</label><input value={f.lang} onChange={e=>set('lang',e.target.value)} className="field"/></div>

        </div>}

        {step === 4 && <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <p className="section-title" style={{marginBottom:4}}>Sensory Profile</p>
          {[

              chipSt:{background:'var(--risk-h-bg)',color:'var(--risk-h)',borderColor:'var(--risk-h-border)'},ph:'e.g. loud clippers — press Enter'},
            {label:'Sensory Preferences',field:'pref',inp:'pI',
              chipSt:{background:'var(--risk-l-bg)',color:'var(--risk-l)',borderColor:'var(--risk-l-border)'},ph:'e.g. warm water — press Enter'},
            {label:'Calming Strategies',field:'calm',inp:'cI',
              chipSt:{background:'var(--st-arrived-bg)',color:'var(--st-arrived)',borderColor:'var(--st-arrived-border)'},ph:'e.g. train videos — press Enter'},
          ].map(({label,field,inp,chipSt,ph}) => (
            <div key={field}>
              <label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:5}}>{label}</label>
              <div style={{marginBottom:6}}>
                {f[field].map(t => (
                  <span key={t} className="chip" style={chipSt}>{t} <button onClick={()=>rmTag(field,t)} style={{marginLeft:4,fontWeight:700,background:'none',border:'none',cursor:'pointer',color:'inherit',padding:0,fontSize:12}}>×</button></span>
                ))}
              </div>
              <input value={f[inp]} onChange={e=>set(inp,e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addTag(field,inp);}}}

        </div>}

        {step === 5 && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <p className="section-title" style={{marginBottom:4}}>Grooming History &amp; Visit Goals</p>

        </div>}

        {step === 6 && <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <p className="section-title" style={{marginBottom:4}}>Emergency Notes &amp; Consent</p>

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:20,paddingTop:16,borderTop:'1px solid var(--border-light)'}}>

          <span style={{fontSize:11,color:'var(--text-faint)'}}>Step {step} of {steps.length}</span>
          {step < 6
            ? <button onClick={() => setStep(s => Math.min(6,s+1))} className="btn-accent">Continue →</button>
            : <button onClick={save} disabled={!f.consent} className="btn-accent" style={{background:'var(--risk-l)',opacity:f.consent?1:0.4}}>Create ECP ✓</button>
          }
        </div>
      </div>
    </div>
  );
};

            </div>
          </div>
          <button onClick={save} className="btn-accent" style={{justifyContent:'center',padding:'12px'}}>Save Post-Visit Notes</button>
          {saved && <div className="banner-success">✓ Notes saved successfully</div>}
        </div>
      </div>
    </div>
  );
};

/* ── SSEP TEAM ── */
const SSEPPage = ({appts}) => {
  const [exp, setExp] = useState(null);
  return (
    <div style={{padding:'32px 36px'}}>
      <div style={{marginBottom:20}}>
        <h1 className="page-title">SSEP Team</h1>
        <p style={{color:'var(--text-muted)',fontSize:13,marginTop:4}}>Sensory-Supportive Experience Professionals</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {SSEPS.map(ssep => {
          const myA = appts.filter(a => a.sId === ssep.id);
          return (
            <div key={ssep.id} className="card" style={{padding:'20px 22px'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:14}}>
                <Avatar name={ssep.name} id={ssep.id} size={44} />
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:2}}>
                    <h3 style={{fontWeight:600,fontSize:14,margin:0,color:'var(--text)'}}>{ssep.name}</h3>
                    <AvBadge a={ssep.availability}/>
                  </div>
                  <p style={{fontSize:11,color:'var(--text-muted)',margin:0}}>{ssep.role}</p>
                </div>
              </div>
              <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:12,lineHeight:1.55}}>{ssep.bio}</p>
              <div style={{display:'flex',flexWrap:'wrap',marginBottom:14}}>
                {ssep.skills.map(s => (
                  <span key={s} className="chip" style={{background:'var(--accent-light)',color:'var(--accent-muted)',borderColor:'var(--accent-border)'}}>{s}</span>
                ))}
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',borderTop:'1px solid var(--border-light)',paddingTop:12}}>
                <p style={{fontSize:11,color:'var(--text-faint)',margin:0}}>{myA.length} appointment{myA.length !== 1 ? 's' : ''} today</p>
                <button onClick={() => setExp(exp === ssep.id ? null : ssep.id)}
                  style={{fontSize:11,color:'var(--text-link)',fontWeight:600,background:'none',border:'none',cursor:'pointer',padding:0}}>
                  {exp === ssep.id ? 'Hide schedule ↑' : 'View schedule ↓'}
                </button>
              </div>
              {exp === ssep.id && (
                <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:4}}>
                  {myA.length === 0 ? <p style={{fontSize:11,color:'var(--text-faint)',margin:0}}>No appointments today</p> : myA.map(a => {
                    const c = gc(a.cId);
                    return c ? (
                      <div key={a.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 10px',background:'var(--bg)',borderRadius:6}}>
                        <div>
                          <p style={{fontSize:11,fontWeight:600,color:'var(--text)',margin:0}}>{a.time} · {c.firstName} {c.lastName}</p>
                          <p style={{fontSize:10,color:'var(--text-faint)',margin:'1px 0 0'}}>{a.service}</p>
                        </div>
                        <StBadge s={a.status}/>
                      </div>
                    ) : null;
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ── APP / ROUTER ── */
function App() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  const [appts, setAppts] = useState(APPTS_INIT);
  const [notes, setNotes] = useState(NOTES_INIT);
  const [extra, setExtra] = useState([]);

  useEffect(() => {
    const h = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);

  const saveNote = n => setNotes(ns => {
    const i = ns.findIndex(x => x.aId === n.aId);
    if (i >= 0) { const c = [...ns]; c[i] = n; return c; }
    return [...ns, {id:'n'+Date.now(), ...n}];
  });

  const path = hash.replace('#','') || '/';
  const parts = path.split('/').filter(Boolean);
  let page;
  if (parts.length === 0 || path === '/')                          page = <Dashboard appts={appts}/>;
  else if (parts[0]==='clients' && !parts[1])                      page = <ClientList extra={extra}/>;
  else if (parts[0]==='clients' && parts[1] && !parts[2])         page = <ECPPage cId={parts[1]} appts={appts}/>;
  else if (parts[0]==='clients' && parts[2]==='res')               page = <RESPage cId={parts[1]}/>;
  else if (parts[0]==='clients' && parts[2]==='acc')               page = <ACCPage cId={parts[1]}/>;
  else if (parts[0]==='intake')                                    page = <ICPSIntake onNew={c=>setExtra(p=>[...p,c])}/>;
  else if (parts[0]==='appointments' && !parts[1])                 page = <ApptsPage appts={appts}/>;
  else if (parts[0]==='appointments' && parts[2]==='notes')        page = <NotesPage aId={parts[1]} appts={appts} allNotes={notes} onSave={saveNote}/>;
  else if (parts[0]==='ssep')                                      page = <SSEPPage appts={appts}/>;
  else page = <div style={{padding:36,color:'var(--text-muted)'}}>Page not found. <a href="#/" style={{color:'var(--text-link)'}}>Go home →</a></div>;

  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--bg)'}}>
      <Sidebar hash={hash}/>
      <main style={{flex:1,overflowY:'auto',marginLeft:240}}>{page}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
