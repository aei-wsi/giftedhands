<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Boardroom — Live Session</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070A12; --panel:#0E1424; --card:#161E33; --card2:#1B2440;
    --gold:#C9A84C; --gold-light:#E8C86E; --live:#3BD17A;
    --text:#F0F0F0; --muted:#94A0B8; --border:rgba(201,168,76,0.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:radial-gradient(1200px 700px at 50% -10%,#101a30 0%,var(--bg) 60%);
       color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100vh;overflow:hidden;}
  .display{font-family:'Playfair Display',Georgia,serif;}
  .gold{color:var(--gold);}

  .app{display:flex;flex-direction:column;height:100vh;}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--border);}
  .title{display:flex;align-items:center;gap:12px;}
  .title h1{font-size:17px;font-weight:600;}
  .title .sub{font-size:12px;color:var(--muted);}
  .rec{display:flex;align-items:center;gap:7px;font-size:12px;color:#ff7a7a;}
  .rec .dot{width:8px;height:8px;border-radius:50%;background:#ff5a5a;animation:pulse 1.4s infinite;}
  .topright{display:flex;align-items:center;gap:18px;font-size:12px;color:var(--muted);}
  .pill{border:1px solid var(--border);border-radius:999px;padding:5px 12px;}

  /* main */
  .main{flex:1;display:flex;min-height:0;}
  .stage{flex:1;padding:18px 18px 6px;display:flex;flex-direction:column;min-width:0;}

  .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
        gap:14px;min-height:0;}

  .tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);
        background:var(--card);transition:box-shadow .25s,border-color .25s,transform .25s;}
  .tile .feed{position:absolute;inset:0;}
  /* faux webcam portrait look */
  .feed{display:flex;align-items:center;justify-content:center;}
  .feed::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%,transparent 40%,rgba(0,0,0,.55) 100%);}
  .portrait{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-family:'Playfair Display',serif;font-size:34px;font-weight:600;color:#10130c;
            box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:1;}

  .nameplate{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:8px;}
  .nameplate .nm{background:rgba(7,10,18,.72);backdrop-filter:blur(4px);padding:4px 10px;border-radius:8px;
                 font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;}
  .mic{width:15px;height:15px;display:inline-block;}
  .badge{font-size:10px;font-weight:600;background:rgba(201,168,76,.16);color:var(--gold-light);
         border:1px solid var(--border);border-radius:999px;padding:2px 8px;z-index:3;position:absolute;right:12px;top:12px;}

  /* speaking + thinking states */
  .tile.speaking{border-color:var(--live);box-shadow:0 0 0 2px var(--live),0 0 32px rgba(59,209,122,.35);transform:translateY(-2px);}
  .tile.speaking .ring{position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 2px rgba(59,209,122,.5);z-index:2;}
  .tile.thinking{border-color:rgba(201,168,76,.5);}
  .status{position:absolute;left:12px;top:12px;z-index:3;font-size:11px;color:var(--muted);display:none;align-items:center;gap:6px;}
  .tile.thinking .status.think{display:flex;}
  .think .d{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:blink 1s infinite;}
  .think .d:nth-child(2){animation-delay:.2s} .think .d:nth-child(3){animation-delay:.4s}

  /* equalizer when speaking */
  .eq{position:absolute;right:12px;bottom:14px;display:none;align-items:flex-end;gap:3px;height:20px;z-index:3;}
  .tile.speaking .eq{display:flex;}
  .eq span{width:3px;background:var(--live);border-radius:2px;animation:bounce .9s infinite ease-in-out;}
  .eq span:nth-child(2){animation-delay:.15s}.eq span:nth-child(3){animation-delay:.3s}
  .eq span:nth-child(4){animation-delay:.45s}.eq span:nth-child(5){animation-delay:.6s}

  .tile.muted .portrait{filter:saturate(.5) brightness(.8);}
  .tile.you{border-color:rgba(201,168,76,.35);}

  /* generated SVG headshots */
  .pbust{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:72%;height:92%;z-index:1;}
  .mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.3);}
  .tile.speaking .mouth{animation:talk .25s infinite ease-in-out;}
  @keyframes talk{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
  .tile.muted .pbust{filter:saturate(.78) brightness(.86);}
  .tile.speaking .pbust{filter:none;}

  /* caption / lower third */
  .caption{margin-top:14px;min-height:78px;background:linear-gradient(180deg,rgba(22,30,51,.6),rgba(14,20,36,.9));
           border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start;}
  .caption .who{font-family:'Playfair Display',serif;font-size:15px;color:var(--gold-light);white-space:nowrap;}
  .caption .who small{display:block;color:var(--muted);font-family:'Inter';font-size:11px;font-weight:400;margin-top:2px;}
  .caption .words{font-size:15px;line-height:1.5;color:#E9EDF6;}
  .cursor{display:inline-block;width:8px;background:var(--gold);margin-left:2px;animation:blink .8s infinite;}

  /* right rail — round table queue */
  .rail{width:248px;border-left:1px solid var(--border);padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:rgba(14,20,36,.4);}
  .rail h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;}
  .qitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid transparent;font-size:13px;}
  .qitem.active{background:rgba(59,209,122,.08);border-color:rgba(59,209,122,.3);}
  .qitem .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#10130c;flex-shrink:0;}
  .qitem .st{margin-left:auto;font-size:10px;color:var(--muted);}
  .qitem.active .st{color:var(--live);}
  .qitem.done .st{color:var(--gold-light);}
  .rail .synth{margin-top:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);}
  .rail .synth b{color:var(--gold-light);font-weight:600;}

  /* control bar */
  .controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;border-top:1px solid var(--border);}
  .ctrl{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--card);
        display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;transition:.15s;}
  .ctrl:hover{border-color:var(--gold);}
  .ctrl.on{background:var(--card2);}
  .ctrl.leave{width:auto;border-radius:24px;padding:0 22px;background:#b3392f;border-color:#b3392f;color:#fff;font-weight:600;font-size:13px;}
  .ctrl svg{width:20px;height:20px;}
  .ctrl-label{font-size:10px;color:var(--muted);}
  .ctrl-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes bounce{0%,100%{height:5px}50%{height:18px}}
  @media (max-width:880px){.rail{display:none}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="title">
      <h1 class="display">The <span class="gold">Boardroom</span> — Live Session</h1>
      <span class="sub">My Executive Advisory Board</span>
    </div>
    <div class="rec"><span class="dot"></span> REC <span id="timer" style="color:var(--muted)">00:42</span></div>
    <div class="topright">
      <span class="pill">Topic: “Should I leave my job to start a company?”</span>
      <span class="pill">7 present</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="stage">
      <div class="grid" id="grid"><!-- tiles injected --></div>

      <!-- live caption / lower-third -->
      <div class="caption">
        <div class="who" id="capWho">—<small id="capRole"></small></div>
        <div class="words"><span id="capText"></span><span class="cursor">&nbsp;</span></div>
      </div>
    </div>

    <!-- RIGHT RAIL -->
    <div class="rail">
      <h3>Round-table order</h3>
      <div id="queue"></div>
      <div class="synth">
        <b>Board Secretary</b> — synthesizing consensus &amp; action items as the round-table proceeds…
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="ctrl-wrap"><div class="ctrl on" title="Mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div><span class="ctrl-label">You · live</span></div>
    <div class="ctrl-wrap"><div class="ctrl" title="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg></div><span class="ctrl-label">Camera</span></div>
    <div class="ctrl-wrap"><div class="ctrl" title="Raise hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V5a2 2 0 0 1 4 0v6m0-1V4a2 2 0 0 1 4 0v7m0-2a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a1.6 1.6 0 0 1 2.6-1.8L7 13"/></svg></div><span class="ctrl-label">Ask board</span></div>
    <div class="ctrl-wrap"><div class="ctrl" title="Document"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15a0 0 0 0 1 0 0H6a0 0 0 0 1 0 0V2z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg></div><span class="ctrl-label">Memo</span></div>
    <div class="ctrl-wrap"><div class="ctrl leave">Leave room</div><span class="ctrl-label">&nbsp;</span></div>
  </div>
</div>

<script>
const members = [
  {name:"Jim Collins", role:"Values Anchor", initials:"JC", color:"linear-gradient(145deg,#E8C86E,#C9A84C)", bg:"#2a3350",
   face:{skin:"#e6b596", hair:"short", hairColor:"#bdb6aa", jacket:"#33405e", glasses:true},
   line:"Before you leap — confront the brutal facts. What can you be the best in the world at, and does this turn your flywheel or fight it?"},
  {name:"Ray Dalio", role:"Challenger", initials:"RD", color:"linear-gradient(145deg,#7FB0FF,#4A78D8)", bg:"#26314a",
   face:{skin:"#e7b897", hair:"short", hairColor:"#d2cdc2", jacket:"#3a3f4d", glasses:false},
   line:"Treat this as a machine. What's the root-cause diagnosis, and are you confusing what you wish were true with what is actually true?"},
  {name:"Brené Brown", role:"Confidant", initials:"BB", color:"linear-gradient(145deg,#F0A18A,#E07A5F)", bg:"#3a2a3a",
   face:{skin:"#f0c3a3", hair:"bob", hairColor:"#cda84f", jacket:"#7a3b4e", glasses:false},
   line:"Name the vulnerability you're armoring against here. Clear is kind — what's the honest fear underneath the spreadsheet?"},
  {name:"Tiffany Aliche", role:"Expert", initials:"TA", color:"linear-gradient(145deg,#B98AF0,#9B5DE5)", bg:"#322a48",
   face:{skin:"#8d5a3c", hair:"long", hairColor:"#241a12", jacket:"#6b4a86", glasses:false},
   line:"Show me the actual numbers. How many months of runway, and what's the smallest, most boring money step you take this week?"},
  {name:"Deb Liu", role:"Sponsor", initials:"DL", color:"linear-gradient(145deg,#6FE0B5,#3D9970)", bg:"#1f3a35",
   face:{skin:"#e8c4a0", hair:"long", hairColor:"#181310", jacket:"#2f6f56", glasses:true},
   line:"Who do you need in your corner for this? Make your value visible and line up the sponsors before you jump, not after."},
  {name:"Keith Ferrazzi", role:"Connector", initials:"KF", color:"linear-gradient(145deg,#6FE6DD,#4ECDC4)", bg:"#1f3a3c",
   face:{skin:"#e2af8e", hair:"buzz", hairColor:"#463729", jacket:"#2f6e6a", glasses:false},
   line:"Who could you bring in to co-elevate this? Don't build it alone — your network is the de-risking strategy you're ignoring."},
];

// ── Procedural SVG headshot generator (placeholder until HeyGen/Tavus avatars) ──
function clampc(v){return Math.max(0,Math.min(255,Math.round(v)));}
function shadeC(hex,amt){let n=parseInt(hex.slice(1),16);let r=clampc((n>>16)+amt),g=clampc(((n>>8)&255)+amt),b=clampc((n&255)+amt);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function hairShape(p){
  const c=p.hairColor;
  switch(p.hair){
    case 'short': return `<path d="M58 88 q-6 -58 42 -60 q48 2 42 60 q-12 -32 -42 -32 q-30 0 -42 32Z" fill="${c}"/>`;
    case 'buzz':  return `<path d="M62 86 q-2 -48 38 -50 q40 2 38 50 q-10 -24 -38 -24 q-28 0 -38 24Z" fill="${c}" opacity=".9"/>`;
    case 'bob':   return `<path d="M52 126 q-10 -82 48 -86 q58 4 48 86 q-6 -36 -18 -48 q-30 -16 -60 0 q-12 12 -18 48Z" fill="${c}"/>`;
    case 'long':  return `<path d="M50 148 Q42 50 100 44 Q158 50 150 148 Q152 84 130 62 Q100 46 70 62 Q48 84 50 148Z" fill="${c}"/>`;
    default: return '';
  }
}
function buildPortrait(i){
  const p=members[i].face;
  const skinDark=shadeC(p.skin,-30);
  const glasses=p.glasses?`<g stroke="#2b2b2b" stroke-width="2.6" fill="rgba(255,255,255,.06)" opacity=".85"><circle cx="82" cy="90" r="12"/><circle cx="118" cy="90" r="12"/><path d="M94 90h12"/></g>`:'';
  return `<svg class="pbust" viewBox="0 0 200 210" preserveAspectRatio="xMidYMax meet">
    <path d="M16 210 Q16 150 58 136 L142 136 Q184 150 184 210 Z" fill="${p.jacket}"/>
    <path d="M84 210 Q100 168 116 210 Z" fill="${shadeC(p.jacket,-18)}"/>
    <rect x="90" y="126" width="20" height="22" rx="6" fill="${p.skin}"/>
    <path d="M86 134 L100 160 L114 134 L124 142 L100 178 L76 142 Z" fill="#f2f3f7"/>
    <ellipse cx="60" cy="96" rx="8" ry="9" fill="${p.skin}"/><ellipse cx="140" cy="96" rx="8" ry="9" fill="${p.skin}"/>
    <ellipse cx="100" cy="92" rx="40" ry="46" fill="${p.skin}"/>
    ${hairShape(p)}
    <path d="M74 80 q9 -5 17 0" stroke="${p.hairColor}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M109 80 q9 -5 17 0" stroke="${p.hairColor}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="82" cy="90" rx="4.4" ry="5.4" fill="#2c2622"/>
    <ellipse cx="118" cy="90" rx="4.4" ry="5.4" fill="#2c2622"/>
    ${glasses}
    <path d="M100 95 l-4 13 q4 3 8 0" stroke="${skinDark}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g class="mouth"><path d="M88 118 q12 11 24 0 q-12 5 -24 0Z" fill="${shadeC('#8a4a47',0)}"/></g>
  </svg>`;
}

// build tiles
const grid = document.getElementById('grid');
const queue = document.getElementById('queue');
members.forEach((m,i)=>{
  grid.insertAdjacentHTML('beforeend', `
    <div class="tile muted" id="tile-${i}">
      <div class="feed" style="background:radial-gradient(85% 75% at 50% 26%, ${m.bg}, #0a0f1a)">
        ${buildPortrait(i)}
      </div>
      <span class="badge">${m.role}</span>
      <div class="status think"><span class="d"></span><span class="d"></span><span class="d"></span> thinking…</div>
      <div class="ring"></div>
      <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="nameplate"><span class="nm">${micIcon()} ${m.name}</span></div>
    </div>`);
  queue.insertAdjacentHTML('beforeend', `
    <div class="qitem" id="q-${i}">
      <span class="av" style="background:${m.color}">${m.initials}</span>
      <span>${m.name}</span><span class="st" id="st-${i}">waiting</span>
    </div>`);
});
// add the user's own tile in the last cell? keep 6 board members; user is the mic. Good.

function micIcon(){return '<svg class="mic" viewBox="0 0 24 24" fill="none" stroke="#3BD17A" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';}
function shade(g){ // pull a darker tone for the feed bg
  const m = g.match(/#([0-9A-Fa-f]{6})/g); return m? hexA(m[1],0.28):'#1a2236';
}
function hexA(hex,a){const n=parseInt(hex.replace('#',''),16);const r=n>>16,gg=(n>>8)&255,b=n&255;return `rgba(${r},${gg},${b},${a})`;}

const capWho=document.getElementById('capWho'),capRole=document.getElementById('capRole'),capText=document.getElementById('capText');
let idx=0;

function speak(i){
  const m=members[i];
  // reset all
  members.forEach((_,k)=>{
    const t=document.getElementById('tile-'+k);
    t.classList.remove('speaking','thinking'); t.classList.add('muted');
    document.getElementById('q-'+k).classList.remove('active');
  });
  // mark previous done
  for(let k=0;k<i;k++){ document.getElementById('q-'+k).classList.add('done'); document.getElementById('st-'+k).textContent='spoke ✓'; }
  // next one "thinking"
  const next=(i+1)%members.length;
  if(next>i){ const nt=document.getElementById('tile-'+next); nt.classList.add('thinking'); nt.classList.remove('muted'); document.getElementById('st-'+next).textContent='up next'; }

  // active speaker
  const t=document.getElementById('tile-'+i);
  t.classList.add('speaking'); t.classList.remove('muted','thinking');
  document.getElementById('q-'+i).classList.add('active');
  document.getElementById('st-'+i).textContent='speaking';
  capWho.firstChild.textContent=m.name; capRole.textContent=m.role;

  // typewriter caption
  capText.textContent='';
  let c=0; const txt=m.line;
  clearInterval(window._type);
  window._type=setInterval(()=>{ capText.textContent=txt.slice(0,c++); if(c>txt.length) clearInterval(window._type); }, 26);
}

function tick(){ speak(idx); idx=(idx+1)%members.length;
  if(idx===0){ // round complete — reset 'done'
    setTimeout(()=>members.forEach((_,k)=>{document.getElementById('q-'+k).classList.remove('done');document.getElementById('st-'+k).textContent='waiting';}), 200);
  }
}
speak(0); idx=1; setInterval(tick, 5200);

// running timer
let secs=42; setInterval(()=>{ secs++; const mm=String(Math.floor(secs/60)).padStart(2,'0'),ss=String(secs%60).padStart(2,'0'); document.getElementById('timer').textContent=mm+':'+ss; },1000);
</script>
</body>
</html>
